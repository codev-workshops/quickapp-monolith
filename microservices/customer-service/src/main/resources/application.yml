server:
  port: 8082

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:sqlite:./data/customer.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: QuickAppMicroservicesJwtSecretKey2024VeryLongAndSecureKeyForHS512Algorithm!!
