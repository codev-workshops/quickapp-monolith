server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: customer-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/customers/**
        - id: product-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/products/**,/api/product-categories/**
        - id: order-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/orders/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
