server:
  port: 8084

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:sqlite:./data/order.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: QuickAppMicroservicesJwtSecretKey2024VeryLongAndSecureKeyForHS512Algorithm!!
  services:
    customer-url: http://localhost:8082
    product-url: http://localhost:8083
